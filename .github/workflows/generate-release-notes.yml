name: Generate AI release notes

# Reusable workflow: generates a release title and release notes from git
# history with OpenRouter's free models router (https://openrouter.ai/openrouter/free),
# and optionally creates or updates the GitHub release.
#
# This is a thin wrapper around the action in this repository's action.yml, for
# callers who prefer a whole job (`jobs.<id>.uses:`) to a step.
#
# Every repository that calls this workflow must define its own
# OPENROUTER_API_KEY secret and pass it in (explicitly or with `secrets: inherit`).

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to generate notes for. Defaults to the triggering tag (github.ref_name) when the caller runs on a tag.
        type: string
        default: ''
      previous-tag:
        description: Tag to diff against. Defaults to the closest earlier tag of the same release type (see `match-release-type`).
        type: string
        default: ''
      match-release-type:
        description: "Pick the previous tag from the same kind of release. A stable release (v2.0.0) is compared against the last stable tag, skipping prereleases (v2.0.0-beta.1), so its notes cover everything since the last stable release; a prerelease is compared against the last prerelease, or the last stable tag if there is none. A tag is a prerelease if its version has a suffix (v2.0.0-rc.1, 2.0.0b1) or `prerelease` is true. Set to false to compare against the closest tag of either kind."
        type: boolean
        default: true
      target:
        description: Commit-ish to release when the tag does not exist yet. Defaults to the triggering commit (github.sha).
        type: string
        default: ''
      tag-pattern:
        description: Glob used to pick the previous tag automatically (passed to `git describe --match`), e.g. `v*`.
        type: string
        default: ''
      model:
        description: "OpenRouter model ID to use, e.g. `anthropic/claude-sonnet-4.5`. List several, separated by commas or new lines, to fall back in order, e.g. `anthropic/claude-sonnet-4.5, openrouter/free`. Empty means the free default: `nvidia/nemotron-3-ultra-550b-a55b:free, nvidia/nemotron-3.5-super-vl:free, openrouter/free`."
        type: string
        default: ''
      instructions:
        description: Extra instructions appended to the prompt (tone, audience, sections to emphasise, ...).
        type: string
        default: ''
      title-template:
        description: Release title template. `{tag}` is replaced with the tag and `{title}` with the AI-generated title.
        type: string
        default: '{tag}: {title}'
      max-commits:
        description: Maximum number of commits sent to the model.
        type: number
        default: 200
      max-input-chars:
        description: Maximum size of the git context sent to the model, in characters.
        type: number
        default: 60000
      temperature:
        description: Sampling temperature.
        type: number
        default: 0.3
      max-tokens:
        description: Maximum tokens in the model response, including hidden reasoning. Empty means 16384 when every model is free (free models are all reasoning models) and 4096 otherwise.
        type: string
        default: ''
      retries:
        description: Number of attempts against OpenRouter before giving up (free models are rate limited and vary in quality).
        type: number
        default: 3
      use-github-notes:
        description: "Also send GitHub's auto-generated notes (merged PRs, new contributors) to the model as context. Needs `contents: write`; skipped silently otherwise."
        type: boolean
        default: true
      append-changelog-link:
        description: Append a "Full Changelog" compare link to the notes.
        type: boolean
        default: true
      fail-on-error:
        description: Fail the job if the AI notes cannot be generated. When false, falls back to GitHub's notes (or a plain commit list) and the tag as title.
        type: boolean
        default: false
      create-release:
        description: "Create the GitHub release (or update it if it already exists) with the generated title and notes. Needs `contents: write`."
        type: boolean
        default: false
      draft:
        description: Create the release as a draft (only when a new release is created).
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a prerelease (only when a new release is created).
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      api-base-url:
        description: OpenRouter API base URL.
        type: string
        default: https://openrouter.ai/api/v1
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter API key. Must be set as a secret in each repository that uses this workflow.
        required: true
      WORKFLOW_REPO_TOKEN:
        description: Token that can read the repository hosting this workflow. Only needed when that repository is private or internal; defaults to github.token.
        required: false
    outputs:
      title:
        description: Release title.
        value: ${{ jobs.generate.outputs.title }}
      notes:
        description: Release notes (Markdown).
        value: ${{ jobs.generate.outputs.notes }}
      tag:
        description: Tag the notes were generated for.
        value: ${{ jobs.generate.outputs.tag }}
      previous-tag:
        description: Tag the changes were compared against (empty if none).
        value: ${{ jobs.generate.outputs.previous-tag }}
      model:
        description: Model OpenRouter actually used (empty if the fallback was used).
        value: ${{ jobs.generate.outputs.model }}
      ai-generated:
        description: "'true' if the notes came from the model, 'false' if the fallback was used."
        value: ${{ jobs.generate.outputs.ai-generated }}
      release-url:
        description: URL of the created or updated release (only when create-release is true).
        value: ${{ jobs.generate.outputs.release-url }}

jobs:
  generate:
    name: Generate release notes
    runs-on: ${{ inputs.runs-on }}
    outputs:
      title: ${{ steps.notes.outputs.title }}
      notes: ${{ steps.notes.outputs.notes }}
      tag: ${{ steps.notes.outputs.tag }}
      previous-tag: ${{ steps.notes.outputs.previous-tag }}
      model: ${{ steps.notes.outputs.model }}
      ai-generated: ${{ steps.notes.outputs.ai-generated }}
      release-url: ${{ steps.notes.outputs.release-url }}
    steps:
      - name: Check prerequisites
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error title=OPENROUTER_API_KEY is not set::Add an OPENROUTER_API_KEY secret to this repository (Settings > Secrets and variables > Actions) and pass it to this reusable workflow under 'secrets:' (OPENROUTER_API_KEY) or with 'secrets: inherit'. Get a key at https://openrouter.ai/keys"
            exit 1
          fi
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::This runner doesn't provide job.workflow_repository / job.workflow_sha (GitHub Enterprise Server?). Use the action directly: uses: pacnpal/free-ai-release-notes@<version>"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The logic lives in this repository's action.yml. Check it out at the exact commit this
      # workflow was called at, so a caller pinned to a tag or SHA runs the matching action.
      - name: Check out free-ai-release-notes
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .free-ai-release-notes
          # The caller's github.token can only read the caller's repository and public ones.
          token: ${{ secrets.WORKFLOW_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Generate release notes
        id: notes
        uses: ./.free-ai-release-notes
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ inputs.previous-tag }}
          match-release-type: ${{ inputs.match-release-type }}
          target: ${{ inputs.target }}
          tag-pattern: ${{ inputs.tag-pattern }}
          model: ${{ inputs.model }}
          instructions: ${{ inputs.instructions }}
          title-template: ${{ inputs.title-template }}
          max-commits: ${{ inputs.max-commits }}
          max-input-chars: ${{ inputs.max-input-chars }}
          temperature: ${{ inputs.temperature }}
          max-tokens: ${{ inputs.max-tokens }}
          retries: ${{ inputs.retries }}
          use-github-notes: ${{ inputs.use-github-notes }}
          append-changelog-link: ${{ inputs.append-changelog-link }}
          fail-on-error: ${{ inputs.fail-on-error }}
          create-release: ${{ inputs.create-release }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          api-base-url: ${{ inputs.api-base-url }}
